[package]
name = "workspace_clone_adapters"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Application adapters for StackHandoff"

[dependencies]
workspace_clone_core = { path = "../core" }
workspace_clone_db = { path = "../db" }
workspace_clone_files = { path = "../files" }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
directories = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }
url = { workspace = true }
# CDP client for browser tab enumeration
reqwest = { version = "0.12", features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# Platform-specific window enumeration
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.9" }
core-foundation-sys = { version = "0.8" }
core-graphics = { version = "0.23" }
objc2 = { version = "0.6", features = ["alloc"] }
objc2-foundation = { version = "0.3" }
objc2-app-kit = { version = "0.3" }
objc2-core-graphics = { version = "0.3" }
libc = { version = "0.2" }

[dev-dependencies]
tokio = { workspace = true }