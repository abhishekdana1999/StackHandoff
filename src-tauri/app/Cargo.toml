[package]
name = "app"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "StackHandoff - Cross-device work-session continuity"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Workspace crates
workspace_clone_core = { path = "../core" }
workspace_clone_crypto = { path = "../crypto" }
workspace_clone_db = { path = "../db" }
workspace_clone_network = { path = "../network" }
workspace_clone_adapters = { path = "../adapters" }
workspace_clone_preflight = { path = "../preflight" }
workspace_clone_restore = { path = "../restore" }
workspace_clone_commands = { path = "../commands" }

# Tauri
tauri = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-os = { workspace = true }

# Utilities
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4", "serde", "fast-rng"] }
chrono = { workspace = true, features = ["serde"] }
dirs = { workspace = true }
