name: Release installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Read and validate version
        id: read
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          tauri_version="$(node -p "JSON.parse(require('node:fs').readFileSync('src-tauri/app/tauri.conf.json', 'utf8')).version")"
          if [[ "$version" != "$tauri_version" ]]; then
            echo "package.json version ($version) must match the Tauri version ($tauri_version)." >&2
            exit 1
          fi

          tag="v${version}"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Pushed tag '$GITHUB_REF_NAME' does not match package.json version tag '$tag'." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npx tauri build --config src-tauri/app/tauri.conf.json --target ${{ matrix.target }}

      - name: Stage macOS release asset
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p release-assets
          cp "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/StackHandoff_${VERSION}_aarch64.dmg" \
            release-assets/StackHandoff.dmg

      - name: Stage Windows release asset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/StackHandoff_${env:VERSION}_x64-setup.exe" `
            "release-assets/StackHandoff.exe"

      - name: Stage Linux release assets
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p release-assets
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          deb="$(find "$bundle/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find "$bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$deb" || { echo "No .deb package found in $bundle/deb" >&2; exit 1; }
          test -n "$appimage" || { echo "No AppImage found in $bundle/appimage" >&2; exit 1; }
          cp "$deb" release-assets/StackHandoff.deb
          cp "$appimage" release-assets/StackHandoff.AppImage

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          if-no-files-found: error
          path: release-assets/*

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets-macos
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: release-assets-linux
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release-assets/StackHandoff.dmg \
              release-assets/StackHandoff.exe \
              release-assets/StackHandoff.deb \
              release-assets/StackHandoff.AppImage \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              release-assets/StackHandoff.dmg \
              release-assets/StackHandoff.exe \
              release-assets/StackHandoff.deb \
              release-assets/StackHandoff.AppImage \
              --title "StackHandoff $VERSION" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
